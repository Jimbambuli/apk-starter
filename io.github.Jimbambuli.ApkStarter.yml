id: io.github.Jimbambuli.ApkStarter
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21
command: apk-starter
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --share=ipc
  # the desktop's GTK 4 settings and colours on GTK's own Adwaita, read only; no host-os (README «Permissions»)
  - --filesystem=xdg-config/gtk-4.0:ro
  # KDE draws the KWin window buttons there, for ATL's title bar (read only)
  - --filesystem=xdg-config/gtk-3.0/assets:ro
  # KWin's title font, decoration and Breeze button size, for the height of ATL's title bar (read only)
  - --filesystem=xdg-config/kdeglobals:ro
  - --filesystem=xdg-config/kwinrc:ro
  - --filesystem=xdg-config/breezerc:ro
  # media of the apps in the desktop's media controls (MPRIS, ATL's MediaSession)
  - --own-name=org.mpris.MediaPlayer2.*
  # accounts of microG (ATL's AccountManager) in the desktop's secret store (libsecret)
  - --talk-name=org.freedesktop.secrets
build-options:
  append-path: /usr/lib/sdk/openjdk21/bin
  env:
    JAVA_HOME: /usr/lib/sdk/openjdk21/jvm/openjdk-21

modules:
  # Not in org.gnome.Sdk//51 (tools/sdk-probe.sh): libbsd (+ libmd) for
  # bionic_translation, OpenXR headers for ATL (the loader is dlopen()ed
  # only by VR apps).
  - name: libmd
    sources:
      - type: archive
        url: https://libbsd.freedesktop.org/releases/libmd-1.1.0.tar.xz
        sha256: 1bd6aa42275313af3141c7cf2e5b964e8b1fd488025caf2f971f43b00776b332
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/man
      - '*.a'
      - '*.la'

  - name: libbsd
    sources:
      - type: archive
        url: https://libbsd.freedesktop.org/releases/libbsd-0.12.2.tar.xz
        sha256: b88cc9163d0c652aaf39a99991d974ddba1c3a9711db8f1b5838af2a14731014
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/man
      - '*.a'
      - '*.la'

  - name: openxr
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTS=OFF
      - -DDYNAMIC_LOADER=ON
    sources:
      - type: archive
        url: https://github.com/KhronosGroup/OpenXR-SDK/archive/refs/tags/release-1.1.49.tar.gz
        sha256: 74e9260a1876b0540171571a09bad853302ec68a911200321be8b0591ca94111
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/doc

  - name: wolfssl
    config-opts:
      - --enable-shared
      - --disable-opensslall
      - --disable-opensslextra
      - --enable-aescbc-length-checks
      - --enable-curve25519
      - --enable-ed25519
      - --enable-ed25519-stream
      - --enable-oldtls
      - --enable-base64encode
      - --enable-tlsx
      - --enable-scrypt
      - --disable-examples
      - --enable-crl
      - --enable-jni
      - --enable-sessioncerts
    sources:
      - type: git
        url: https://github.com/wolfSSL/wolfssl.git
        tag: v5.9.4-stable
        commit: 3c5eead44904df64e6a5a1f4ebdce377d35a849a
      # A declined TLS 1.2 session ticket must fall back to a full handshake (RFC 5077 3.4), not fail with -373.
      - type: patch
        path: build-aux/wolfssl-ticket-decline.patch
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
      - /share/doc
      - '*.la'

  # Fork branch apk-starter = upstream 6253dec + MR !27 (linker) + !28 (pthread).
  - name: bionic_translation
    buildsystem: meson
    sources:
      - type: git
        url: https://gitlab.com/Jimbambuli/bionic_translation.git
        commit: c845fedd3a7f9a473e58c96608ac38735e2c0553

  - name: art_standalone
    buildsystem: simple
    build-options:
      env:
        # The AOSP-style makefiles ignore LDFLAGS; -lbsd lives in /app/lib.
        LIBRARY_PATH: /app/lib
    build-commands:
      - make -j$FLATPAK_BUILDER_N_JOBS ____PREFIX=/app ____LIBDIR=lib
      - make ____PREFIX=/app ____LIBDIR=lib install
      # ART's JVMTI plugin (not in ____art_all, its make target lacks include paths): built with atl-doctor's
      # script and template fix (needed with GCC 14 and 16); loaded only for «Start with log/debug».
      - patch -p0 < atl-doctor/tools/openjdkjvmti-gcc14.diff
      - J=$FLATPAK_BUILDER_N_JOBS bash atl-doctor/tools/build-jvmti-plugin.sh . /app
      - install -Dm755 jvmti-out/libopenjdkjvmti.so /app/lib/art/libopenjdkjvmti.so
    sources:
      - type: git
        url: https://gitlab.com/Jimbambuli/art_standalone.git
        branch: tv6-fix1
        commit: a6a9158dcc24c17e3c86ec030588ebe59148ccb8
      - type: git
        url: https://github.com/Jimbambuli/atl-doctor.git
        commit: db670bef245ca1213ebd05926adb97460c7d48a7
        dest: atl-doctor

  # ATL's jni_upcall_gen resolves asm/asm-tree/java-getopt via xmvn5-resolve or
  # a Maven download; the build has no network, so ship the jars and a stand-in.
  - name: jni-upcall-deps
    buildsystem: simple
    build-commands:
      - install -Dm644 -t /app/share/apk-starter-build/java asm.jar asm-tree.jar java-getopt.jar
      - install -Dm755 xmvn5-resolve /app/bin/xmvn5-resolve
    sources:
      - type: file
        url: https://repo1.maven.org/maven2/org/ow2/asm/asm/9.8/asm-9.8.jar
        sha256: 876eab6a83daecad5ca67eb9fcabb063c97b5aeb8cf1fca7a989ecde17522051
        dest-filename: asm.jar
      - type: file
        url: https://repo1.maven.org/maven2/org/ow2/asm/asm-tree/9.8/asm-tree-9.8.jar
        sha256: 14b7880cb7c85eed101e2710432fc3ffb83275532a6a894dc4c4095d49ad59f1
        dest-filename: asm-tree.jar
      - type: file
        url: https://repo1.maven.org/maven2/gnu/getopt/java-getopt/1.0.13/java-getopt-1.0.13.jar
        sha256: f09dc6369ffc4fe4362cbd49b6ac6c4a7471375ac5d884c71b0a625a889c38c4
        dest-filename: java-getopt.jar
      - type: file
        path: build-aux/xmvn5-resolve
    cleanup:
      - /share/apk-starter-build
      - /bin/xmvn5-resolve

  - name: android_translation_layer
    buildsystem: meson
    config-opts:
      - -Ddownload_tool_deps=false
    sources:
      - type: git
        url: https://gitlab.com/Jimbambuli/android_translation_layer.git
        branch: tv6-fix1
        commit: 10a6b462aa5cd80e1731f8ea5209e5f03073385c

  # atl-doctor (public, fixed commit): JVMTI agent and trace counter for Log/Debug, its Python package for the
  # Debug recorder, and the stub list of exactly this ATL (for stub hits). The starter only records: reports come
  # from atl-doctor itself, so its report, diff and AOSP code are left out.
  - name: atl-doctor
    buildsystem: simple
    build-commands:
      - meson setup _build agent --prefix=/app -Djdk=$JAVA_HOME
      - ninja -C _build libatl_doctor_agent.so atl-doctor-tracecount
      - install -Dm755 -t /app/lib/atl-doctor _build/libatl_doctor_agent.so _build/atl-doctor-tracecount
      - mkdir -p /app/share/apk-starter && cp -r atl_doctor /app/share/apk-starter/atl_doctor
      - install -Dm644 LICENSE /app/share/licenses/io.github.Jimbambuli.ApkStarter/atl-doctor-LICENSE
      - >-
        PYTHONPATH=/app/share/apk-starter python3 -c "import pathlib, sys;
        from atl_doctor.sources.stubs import build_stub_list, save_stub_tsv;
        jars = sorted(pathlib.Path('/app/lib/java/dex/android_translation_layer').glob('*.jar'));
        save_stub_tsv(build_stub_list(pathlib.Path('atl-src'), jars), pathlib.Path('/app/share/apk-starter/stubs.tsv'))"
      - cd /app/share/apk-starter/atl_doctor && rm report.py diff.py sources/aosp.py sources/aosp_fetch.py sources/scan.py
      - find /app/share/apk-starter/atl_doctor -name __pycache__ -prune -exec rm -rf {} +
    sources:
      - type: git
        url: https://github.com/Jimbambuli/atl-doctor.git
        commit: db670bef245ca1213ebd05926adb97460c7d48a7
      - type: git
        url: https://gitlab.com/Jimbambuli/android_translation_layer.git
        commit: 10a6b462aa5cd80e1731f8ea5209e5f03073385c
        dest: atl-src

  - name: apk-starter
    buildsystem: simple
    build-commands:
      - install -Dm755 apk-starter /app/bin/apk-starter
      - mkdir -p /app/share/apk-starter
      - cp -r src/apk_starter /app/share/apk-starter/apk_starter
      - install -Dm644 data/build-info /app/share/apk-starter/build-info
      - install -Dm644 $JAVA_HOME/lib/security/cacerts /app/share/apk-starter/cacerts
      # Translations (po/LINGUAS): catalogs for the program, merged texts for the menu entry and AppStream.
      - for l in $(cat po/LINGUAS); do install -d /app/share/locale/$l/LC_MESSAGES && msgfmt --check -o /app/share/locale/$l/LC_MESSAGES/apk-starter.mo po/$l.po || exit 1; done
      - msgfmt --desktop --template=data/io.github.Jimbambuli.ApkStarter.desktop.in -d po -o io.github.Jimbambuli.ApkStarter.desktop
      - msgfmt --xml --template=data/io.github.Jimbambuli.ApkStarter.metainfo.xml.in -d po -o io.github.Jimbambuli.ApkStarter.metainfo.xml
      - install -Dm644 io.github.Jimbambuli.ApkStarter.desktop /app/share/applications/io.github.Jimbambuli.ApkStarter.desktop
      - install -Dm644 io.github.Jimbambuli.ApkStarter.metainfo.xml /app/share/metainfo/io.github.Jimbambuli.ApkStarter.metainfo.xml
      - install -Dm644 data/icons/io.github.Jimbambuli.ApkStarter.svg /app/share/icons/hicolor/scalable/apps/io.github.Jimbambuli.ApkStarter.svg
    sources:
      - type: dir
        path: .
        skip:
          - .git
          - .venv
          - docs
          - tests
          - .github
          - pages
          - tools
          - build-dir
          - repo
          - .flatpak-builder
